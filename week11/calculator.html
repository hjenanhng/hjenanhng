<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Simple Calculator</title>
    <script language="javascript">
        function solve() {
            var n1 = document.getElementById("num1").value;
            var n2 = document.getElementById("num2").value;
            var op = document.getElementById("operator").value;
            var res = document.getElementById("result");

            // Biểu thức chính quy kiểm tra toán tử hợp lệ
            var pattern = /^[+\-*/%]$/;

            if (isNaN(n1) || n1 == "" || isNaN(n2) || n2 == "") {
                alert("Please enter valid numbers!");
            } else if (!pattern.test(op)) {
                alert("Operator must be +, -, *, / or %");
            } else {
                // Sử dụng hàm eval() để thực hiện phép tính từ chuỗi
                var expression = n1 + op + n2;
                res.value = eval(expression);
            }
        }
    </script>
</head>
<body>
    <h2 align="center">CALCULATOR</h2>
    <table align="center" border="1" cellpadding="10">
        <tr>
            <td>Number 1:</td>
            <td><input type="text" id="num1" size="10"></td>
        </tr>
        <tr>
            <td>Operator:</td>
            <td><input type="text" id="operator" size="10" placeholder="+, -, *, /"></td>
        </tr>
        <tr>
            <td>Number 2:</td>
            <td><input type="text" id="num2" size="10"></td>
        </tr>
        <tr>
            <td>Result:</td>
            <td><input type="text" id="result" size="10" readonly></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <button onclick="solve()">Calculate</button>
            </td>
        </tr>
    </table>
</body>
</html>
